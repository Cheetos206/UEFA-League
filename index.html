<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UEFA League</title>
<meta name="description" content="League manager with teams, players, standings, match stats and player values.">
<meta name="theme-color" content="#060d24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b1536' stroke='%233da5ff' stroke-width='3'/%3E%3Cpolygon points='32,16 45,25 40,40 24,40 19,25' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* UEFA League – stylesheet */
:root {
  color-scheme: dark;
  --bg: #060d24;
  --bg2: #0b1536;
  --card: #101c45;
  --card2: #15245a;
  --line: rgba(255, 255, 255, .09);
  --text: #eef2ff;
  --muted: #98a4c8;
  --accent: #3da5ff;
  --accent2: #7b5cff;
  --g: #34d399;
  --a: #60a5fa;
  --t: #fbbf24;
  --s: #f472b6;
  --danger: #ef4444;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: radial-gradient(1200px 600px at 80% -10%, #1b2f7a55, transparent 60%), radial-gradient(900px 500px at -10% 10%, #4b2fa355, transparent 60%), var(--bg);
  background-attachment: fixed; min-height: 100vh; display: flex; flex-direction: column;
}
body.no-scroll { overflow: hidden; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
.wrap { width: min(1180px, 100% - 32px); margin-inline: auto; }
main.wrap { flex: 1; padding: 28px 0 56px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.lead { color: var(--muted); margin: 6px 0 18px; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 30; background: rgba(6, 13, 36, .85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); }
.brand:hover { text-decoration: none; }
.brand-logo { width: 38px; height: 38px; object-fit: contain; }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-text strong { font-size: 20px; letter-spacing: .08em; }
.brand-text small { color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.nav { display: flex; gap: 4px; }
.nav a { color: var(--muted); padding: 8px 12px; border-radius: 8px; font-weight: 500; }
.nav a:hover { color: var(--text); background: rgba(255, 255, 255, .06); text-decoration: none; }
.nav a.active { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
.nav-admin { border: 1px solid var(--line); margin-left: 6px; }
.menu-toggle { display: none; background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; font-size: 20px; padding: 4px 10px; cursor: pointer; }

/* hero */
.hero { display: flex; align-items: center; gap: 36px; padding: 36px; border-radius: 22px; margin-bottom: 20px; border: 1px solid var(--line);
  background: linear-gradient(135deg, rgba(61, 165, 255, .16), rgba(123, 92, 255, .16)), var(--bg2); box-shadow: var(--shadow); }
.hero-logo { width: 190px; height: 190px; object-fit: contain; filter: drop-shadow(0 10px 30px rgba(61, 165, 255, .4)); animation: float 6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-8px) rotate(3deg); } }
.eyebrow { text-transform: uppercase; letter-spacing: .18em; font-size: 12px; color: var(--accent); font-weight: 700; }
.hero h1 { font-size: clamp(34px, 6vw, 58px); letter-spacing: .04em; margin: 6px 0 10px; }
.hero h1 span { font-weight: 300; color: var(--muted); }
.hero p { color: var(--muted); max-width: 520px; margin: 0 0 18px; font-size: 16px; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* buttons & forms */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--card2); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; transition: .15s; }
.btn:hover { background: #1d2f70; text-decoration: none; }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: #fff; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: #ff8a8a; border-color: rgba(239, 68, 68, .4); }
.btn.danger:hover { background: rgba(239, 68, 68, .18); }
.btn.small { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
input, select { font: inherit; color: var(--text); background: #0a1334; border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; min-width: 0; }
input:focus, select:focus, .btn:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=color] { padding: 2px; height: 40px; width: 100%; }
label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 600; }
label small { font-weight: 400; }
.icon-btn { background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }

/* cards & layout */
.page-title { font-size: 30px; margin-bottom: 16px; }
.card { background: linear-gradient(180deg, var(--card), var(--bg2)); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 18px; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.card-head h2 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
.card-head a { font-size: 13px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.grid-2 > .card { margin-bottom: 0; }
.grid-2 { margin-bottom: 18px; }
.stack { display: grid; gap: 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 18px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; text-align: center; }
.tile b { display: block; font-size: 32px; line-height: 1.1; }
.tile span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.tile.g b { color: var(--g); } .tile.a b { color: var(--a); } .tile.t b { color: var(--t); } .tile.s b { color: var(--s); }
.empty { color: var(--muted); text-align: center; padding: 26px 10px; }
.empty.big { padding: 80px 10px; }
.back { display: inline-block; margin-bottom: 14px; color: var(--muted); }

/* badges */
.badge { --s: 28px; width: var(--s); height: var(--s); border-radius: 50%; flex: none; display: inline-grid; place-items: center; background: var(--c, #1d6fe0); color: #fff; font-weight: 800; font-size: calc(var(--s) * .32); letter-spacing: .02em; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .25); }
.badge.img { background: #fff; padding: 12%; } .badge.img img { width: 100%; height: 100%; object-fit: contain; }
.tlink { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-weight: 600; }

/* tables */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.table th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.table td { padding: 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.table tbody tr:hover { background: rgba(255, 255, 255, .03); }
.table .left { text-align: left; }
.table tfoot td { font-weight: 700; border-bottom: 0; background: rgba(255, 255, 255, .04); }
.table td.hl { font-weight: 800; } .hl.g { color: var(--g); } .hl.a { color: var(--a); } .hl.t { color: var(--t); } .hl.s { color: var(--s); }
.standings tr.top td:first-child { box-shadow: inset 3px 0 var(--accent); }
.actions { text-align: right !important; } .actions .btn + .btn { margin-left: 6px; }
.form { display: inline-flex; gap: 4px; }
.form i { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font: 700 11px/1 system-ui; font-style: normal; color: #06101f; }
.form .W { background: var(--g); } .form .D { background: #94a3b8; } .form .L { background: #f87171; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: rgba(255, 255, 255, .08); }
.chip.g { color: var(--g); } .chip.a { color: var(--a); } .chip.t { color: var(--t); } .chip.s { color: var(--s); }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; background: rgba(255, 255, 255, .08); color: var(--muted); }
.pill.ok { background: rgba(52, 211, 153, .15); color: var(--g); }

/* matches */
.match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.match-card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--text); transition: .15s; }
.match-card:hover { text-decoration: none; transform: translateY(-2px); border-color: var(--accent); }
.mc-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.mc-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.mc-team { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mc-team b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.mc-team.right { justify-content: flex-end; text-align: right; }
.mc-score { font-size: 22px; font-weight: 800; background: rgba(255, 255, 255, .07); padding: 2px 12px; border-radius: 8px; white-space: nowrap; }
.mc-score i { font-style: normal; color: var(--muted); margin: 0 4px; }
.mc-score.upcoming { font-size: 14px; color: var(--muted); }
.mc-foot { text-align: center; font-size: 11px; color: var(--accent); margin-top: 6px; text-transform: uppercase; letter-spacing: .1em; }
.round { margin: 22px 0 10px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .12em; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.filters input[type=search] { flex: 1; min-width: 180px; }
.seg { display: inline-flex; background: #0a1334; border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { background: none; border: 0; color: var(--muted); padding: 7px 14px; border-radius: 7px; cursor: pointer; font: inherit; font-weight: 600; }
.seg button.on { background: var(--card2); color: #fff; }
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 28px 16px; margin-bottom: 18px; border-radius: 20px; border: 1px solid var(--line); background: linear-gradient(135deg, rgba(61, 165, 255, .14), rgba(123, 92, 255, .14)), var(--bg2); text-align: center; }
.sb-team a { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--text); font-size: 18px; }
.sb-mid { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.sb-score { font-size: clamp(40px, 8vw, 72px); font-weight: 800; line-height: 1; }
.sb-score i { font-style: normal; color: var(--muted); margin: 0 10px; }
.sb-round, .sb-date, .sb-venue { color: var(--muted); font-size: 13px; }
.admin-bar { margin-bottom: 14px; }

/* teams / players */
.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.team-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 22px 16px 16px; border-radius: var(--radius); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 28%, var(--card)), var(--card) 70%); border: 1px solid var(--line); color: var(--text); transition: .15s; }
.team-card:hover { text-decoration: none; transform: translateY(-3px); border-color: var(--c); }
.team-card small { color: var(--muted); }
.tc-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.tc-stats span { font-size: 10px; color: var(--muted); text-transform: uppercase; } .tc-stats b { display: block; font-size: 17px; color: var(--text); }
.team-head { display: flex; align-items: center; gap: 22px; padding: 24px; border-radius: 20px; margin-bottom: 18px; border: 1px solid var(--line); background: linear-gradient(135deg, color-mix(in srgb, var(--c) 35%, transparent), transparent 70%), var(--bg2); }
.team-head h1 { font-size: 30px; margin-bottom: 4px; } .team-head p { margin: 2px 0; color: var(--muted); }
.shirt { width: 84px; height: 84px; border-radius: 22px; display: grid; place-items: center; font-size: 38px; font-weight: 800; background: var(--c); color: #fff; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .25); }

/* leaders */
.leader-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.leader-tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.leader-tile b { font-size: 34px; line-height: 1.1; } .leader-tile small { color: var(--muted); }
.lt-k { text-transform: uppercase; letter-spacing: .1em; font-size: 11px; color: var(--muted); }
.leader-tile.g b { color: var(--g); } .leader-tile.a b { color: var(--a); } .leader-tile.t b { color: var(--t); } .leader-tile.s b { color: var(--s); }
.leaders-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.leaders-grid .card { margin: 0; }
.leader ol { list-style: none; margin: 0; padding: 0; counter-reset: n; }
.leader li { counter-increment: n; display: grid; grid-template-columns: 26px 1fr 90px 34px; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.leader li::before { content: counter(n); color: var(--muted); font-weight: 700; }
.lb-name { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; } .lb-name small { color: var(--muted); }
.lb-bar { height: 6px; background: rgba(255, 255, 255, .08); border-radius: 9px; overflow: hidden; } .lb-bar i { display: block; height: 100%; border-radius: 9px; background: currentColor; }
.leader.g { color: var(--g); } .leader.a { color: var(--a); } .leader.t { color: var(--t); } .leader.s { color: var(--s); }
.leader li b, .leader a { color: var(--text); } .leader li b { text-align: right; }

/* admin */
.admin-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 18px; border-bottom: 1px solid var(--line); }
.tabs a { padding: 10px 16px; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 600; }
.tabs a.on { color: #fff; border-color: var(--accent); } .tabs a:hover { text-decoration: none; color: #fff; }
.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; } .toolbar h2 { font-size: 20px; }
.banner { background: rgba(251, 191, 36, .1); border: 1px solid rgba(251, 191, 36, .35); color: #fde68a; padding: 10px 14px; border-radius: 10px; font-size: 14px; }
.login-card { max-width: 400px; margin: 50px auto; text-align: center; } .login-card h1 { margin: 10px 0 4px; font-size: 24px; }
.login-card form { display: grid; gap: 14px; text-align: left; margin-top: 18px; }
.err { color: #ff8a8a; min-height: 18px; font-size: 13px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .form-grid.one { grid-template-columns: 1fr; }
.form-grid .full, .form-actions.full { grid-column: 1 / -1; }
.form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; } .btn-col { display: grid; gap: 10px; }
.steps { padding-left: 20px; color: var(--muted); } .steps li { margin: 4px 0; }
code { background: rgba(255, 255, 255, .08); padding: 1px 6px; border-radius: 5px; font-size: 13px; }
.score-inputs { display: flex; align-items: end; gap: 10px; grid-column: 1 / -1; } .score-inputs label { flex: 1; } .score-inputs span { padding-bottom: 10px; color: var(--muted); }

/* modal */
.modal-back { position: fixed; inset: 0; z-index: 100; background: rgba(2, 6, 20, .75); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px; }
.modal { width: min(520px, 100%); max-height: 92vh; overflow: auto; background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.modal.wide { width: min(980px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg2); z-index: 1; }
.modal-body { padding: 20px; }
.sg-head { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 10px; }
.sg-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.sg-team h4 { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; } .sg-total { margin-left: auto; color: var(--g); font-size: 12px; }
.sg-row { display: grid; grid-template-columns: 44px 1fr repeat(4, 54px); gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
.sg-row input[type=number] { padding: 6px 4px; text-align: center; width: 100%; }
.sg-row input[type=checkbox] { justify-self: center; width: 18px; height: 18px; accent-color: var(--accent); }
.sg-headrow { font-size: 11px; text-transform: uppercase; color: var(--muted); text-align: center; } .sg-headrow span:nth-child(2) { text-align: left; }
.sg-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .sg-name small { color: var(--muted); margin-left: 4px; }

/* footer & toast */
.footer { border-top: 1px solid var(--line); padding: 18px 0; color: var(--muted); font-size: 13px; }
.footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px); opacity: 0; pointer-events: none; z-index: 200; background: #fff; color: #0a1334; padding: 10px 18px; border-radius: 999px; font-weight: 600; box-shadow: var(--shadow); transition: .25s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* responsive */
@media (max-width: 860px) {
  .grid-2, .leaders-grid, .sg-cols { grid-template-columns: 1fr; }
  .hero { flex-direction: column; text-align: center; padding: 26px 18px; } .hero p { margin-inline: auto; } .hero-actions { justify-content: center; } .hero-logo { width: 140px; height: 140px; }
  .menu-toggle { display: block; }
  .nav { display: none; position: absolute; top: 64px; left: 0; right: 0; flex-direction: column; background: var(--bg2); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .nav.open { display: flex; } .nav-admin { margin: 0; }
  .team-head { flex-direction: column; text-align: center; }
  .scoreboard { grid-template-columns: 1fr; } .sb-team a { font-size: 16px; }
}
@media (max-width: 560px) {
  .form-grid { grid-template-columns: 1fr; }
  .match-grid { grid-template-columns: 1fr; }
  .sg-row { grid-template-columns: 34px 1fr repeat(4, 44px); }
  .page-title { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }

/* ties & admin bars */
.admin-bar { display: flex; gap: 8px; flex-wrap: wrap; }
.tie-agg { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; text-align: center; margin-bottom: 12px; }
.tie-agg b { font-size: 26px; background: rgba(255,255,255,.07); padding: 2px 16px; border-radius: 8px; }
.tie-legs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tie-legs a { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); color: var(--text); font-size: 13px; }
.tie-legs a.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; }
.tie-legs a:hover { text-decoration: none; border-color: var(--accent); }

.ask-msg { margin: 0 0 16px; font-size: 16px; }
.export-txt { width: 100%; height: 320px; margin: 10px 0; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--text); background: #0a1334; border: 1px solid var(--line); border-radius: 9px; padding: 10px; resize: vertical; }
.banner.ok { background: rgba(52, 211, 153, .1); border-color: rgba(52, 211, 153, .35); color: #a7f3d0; }
.setup h2 { font-size: 18px; margin-bottom: 6px; }

/* values, MVP, uploads */
.val { color: #86efac; font-weight: 700; }
.star { color: #fbbf24; }
.tile.v b { color: #86efac; } .tile.m b { color: #fbbf24; }
.leader-tile.value b { color: #86efac; }
.leader.value { color: #86efac; } .leader.mvps { color: #fbbf24; }
.mc-foot.mvp { color: #fbbf24; text-transform: none; letter-spacing: 0; font-size: 12px; }
.mvp-row td { background: rgba(251, 191, 36, .07); }
.mvp-banner { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; padding: 14px 18px; border-radius: 14px; border: 1px solid rgba(251, 191, 36, .4); background: linear-gradient(135deg, rgba(251, 191, 36, .16), rgba(251, 191, 36, .04)); color: var(--text); }
.mvp-banner:hover { text-decoration: none; border-color: #fbbf24; }
.mvp-banner .star { font-size: 30px; line-height: 1; }
.mvp-banner small { display: block; color: #fbbf24; text-transform: uppercase; letter-spacing: .12em; font-size: 11px; }
.mvp-banner b { font-size: 18px; } .mvp-banner em { font-style: normal; color: var(--muted); margin-left: 6px; }
.mvp-banner .bonus { margin-left: auto; color: #86efac; font-weight: 800; white-space: nowrap; }
.banner.warn { background: rgba(239, 68, 68, .1); border-color: rgba(239, 68, 68, .4); color: #fecaca; }
.img-field .lbl { font-size: 13px; color: var(--muted); font-weight: 600; display: block; margin-bottom: 6px; }
.img-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.img-prev { min-width: 72px; min-height: 72px; display: grid; place-items: center; background: #0a1334; border: 1px dashed var(--line); border-radius: 12px; padding: 4px; }
.img-prev img { max-width: 120px; max-height: 72px; object-fit: contain; }
.img-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; } .img-actions small { flex-basis: 100%; }
.admin-list { list-style: none; margin: 8px 0 14px; padding: 0; } .admin-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
@media (max-width: 560px) { .mvp-banner { flex-wrap: wrap; } .mvp-banner .bonus { margin-left: 0; } }
.badge.img { display: inline-flex; align-items: center; justify-content: center; overflow: hidden; padding: 0; }
.badge.img img { width: 78%; height: 78%; object-fit: contain; display: block; }

.upload-btn { position: relative; overflow: hidden; cursor: pointer; }
.upload-btn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
.savebar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 120; display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 18px; border-radius: 999px; background: #fff; color: #0a1334; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: calc(100% - 24px); }
.savebar .btn { border-radius: 999px; padding: 8px 22px; }
[hidden] { display: none !important; }

/* halves */
.halves-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.halves-row span { background: rgba(255,255,255,.07); border-radius: 8px; padding: 4px 10px; text-align: center; }
.halves-row small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.halves-grid { display: grid; grid-template-columns: 90px 1fr 1fr; gap: 8px 10px; align-items: center; margin: 16px 0 4px; max-width: 520px; }
.halves-grid input { width: 100%; text-align: center; }
.halves-grid b { font-size: 13px; color: var(--muted); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.halves-grid .tot { color: var(--text); font-size: 18px; } .hl-name { color: var(--muted); font-size: 13px; }

/* phone friendliness */
@media (max-width: 700px) {
  main.wrap { padding: 18px 0 90px; }
  input, select, textarea { font-size: 16px; }                 /* stops iOS zooming into fields */
  .btn { min-height: 40px; }
  .modal-back { padding: 0; align-items: end; }
  .modal, .modal.wide { width: 100%; max-height: 94vh; border-radius: 16px 16px 0 0; }
  .modal-body { padding: 14px; }
  .toolbar { flex-wrap: wrap; gap: 10px; }
  .admin-head { gap: 10px; }
  .tabs a { padding: 10px 12px; }
  .hero { padding: 22px 16px; }
  .scoreboard { padding: 20px 12px; }
  .actions { white-space: normal !important; } .actions .btn { margin: 2px 0 2px 6px !important; }
  .savebar { left: 12px; right: 12px; transform: none; justify-content: space-between; bottom: max(12px, env(safe-area-inset-bottom)); }
  .halves-grid { grid-template-columns: 62px 1fr 1fr; }
}
body.no-scroll .savebar { display: none; }

/* transfers & loans */
.pill.live { background: rgba(251, 191, 36, .16); color: #fbbf24; }
.arrow { color: var(--accent); margin: 0 6px; font-weight: 700; }

.tr-list { display: grid; gap: 10px; }
.tr-item { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, .03); }
.tr-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-weight: 700; }
.tr-top .pill { margin: 0; }
.tr-move { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; margin: 8px 0; }
.tr-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tr-foot .actions { display: flex; gap: 6px; }
.tr-prev { background: rgba(255, 255, 255, .05); border-radius: 10px; padding: 10px 12px; margin: 0; min-height: 20px; }
.tr-prev:empty { display: none; }
.mvp-rule { margin: 8px 0; }
td .pill { margin-left: 6px; font-size: 11px; padding: 2px 8px; }

</style>
</head>

    msg = unescape(encodeURIComponent(msg));
    const rotr = (n, x) => (x >>> n) | (x << (32 - n));
    const frac = (x) => ((x - Math.floor(x)) * 4294967296) | 0;
    const K = [], H = [];
    for (let c = 2; K.length < 64; c++) {
      let prime = true;
      for (let d = 2; d * d <= c; d++) if (c % d === 0) { prime = false; break; }
      if (prime) { if (H.length < 8) H.push(frac(Math.sqrt(c))); K.push(frac(Math.cbrt(c))); }
    }
    const len = msg.length, words = [];
    for (let i = 0; i < len; i++) words[i >> 2] |= msg.charCodeAt(i) << (24 - (i % 4) * 8);
    words[len >> 2] |= 0x80 << (24 - (len % 4) * 8);
    const total = (((len + 8) >> 6) + 1) * 16;
    for (let i = 0; i < total; i++) if (words[i] === undefined) words[i] = 0;
    words[total - 1] = len * 8;
    let h = H.slice();
    for (let j = 0; j < total; j += 16) {
      const w = words.slice(j, j + 16);
      for (let i = 16; i < 64; i++) {
        const s0 = rotr(7, w[i - 15]) ^ rotr(18, w[i - 15]) ^ (w[i - 15] >>> 3);
        const s1 = rotr(17, w[i - 2]) ^ rotr(19, w[i - 2]) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
      let [a, b, c, d, e, f, g, hh] = h;
      for (let i = 0; i < 64; i++) {
        const S1 = rotr(6, e) ^ rotr(11, e) ^ rotr(25, e);
        const t1 = (hh + S1 + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
        const S0 = rotr(2, a) ^ rotr(13, a) ^ rotr(22, a);
        const t2 = (S0 + ((a & b) ^ (a & c) ^ (b & c))) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      h = [h[0] + a | 0, h[1] + b | 0, h[2] + c | 0, h[3] + d | 0, h[4] + e | 0, h[5] + f | 0, h[6] + g | 0, h[7] + hh | 0];
    }
    return h.map((x) => (x >>> 0).toString(16).padStart(8, '0')).join('');
  }
  const hashPw = (salt, pw) => sha256(salt + ':' + pw);

  /* ---------- Supabase RPC ---------- */
  async function rpc(name, args) {
    let res;
    try {
      res = await fetch(CFG.supabase.url.replace(/\/$/, '') + '/rest/v1/rpc/' + name, {
        method: 'POST',
        headers: Object.assign({ apikey: CFG.supabase.anonKey, 'Content-Type': 'application/json' }, /^sb_/.test(CFG.supabase.anonKey) ? {} : { Authorization: 'Bearer ' + CFG.supabase.anonKey }),
        body: JSON.stringify(args || {})
      });
    } catch (e) { throw { code: 'network', message: 'Cannot reach the database.' }; }
    const text = await res.text();
    let body = null; try { body = text ? JSON.parse(text) : null; } catch (e) { /* not json */ }
    if (!res.ok) throw { code: (body && body.message) || 'http_' + res.status, message: (body && (body.message || body.hint)) || text || 'Request failed' };
    return body;
  }

  /* ---------- load / save ---------- */
  function normalize(d) {
    if (!d || !Array.isArray(d.teams) || !Array.isArray(d.players) || !Array.isArray(d.matches)) throw new Error('Data must contain teams, players and matches arrays.');
    d.site = d.site && typeof d.site === 'object' ? d.site : {};
    if (!Array.isArray(d.transfers)) d.transfers = [];
    return d;
  }
  async function loadRemote() { const r = await rpc('get_league'); data = normalize(r.data && r.data.teams ? r.data : emptyData()); rev = r.rev || 0; }

  async function init() {
    try { token = sessionStorage.getItem(TOKEN_KEY) || null; } catch (e) { token = null; }
    if (remote) {
      try { await loadRemote(); online = true; } catch (e) { online = false; lastError = e.message || ''; data = emptyData(); }
      const tick = async () => {
        if (pushing || dirty || document.hidden) return;
        try {
          const r = await rpc('get_league'); online = true;
          if (r.rev !== rev) { data = normalize(r.data); rev = r.rev; if (hooks.changed) hooks.changed(); }
        } catch (e) { online = false; }
      };
      setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
      return data;
    }
    let local = null;
    try { local = JSON.parse(localStorage.getItem(CFG.storageKey)); } catch (e) { /* ignore */ }
    if (local) { try { data = normalize(local); isDraft = true; return data; } catch (e) { /* fall through */ } }
    if (CFG.dataFile) try {
      const res = await fetch(CFG.dataFile, { cache: 'no-cache' });
      if (res.ok) { data = normalize(await res.json()); return data; }
    } catch (e) { /* no data file */ }
    data = emptyData();
    return data;
  }

  /** Mark the data as changed. Nothing is stored until commit() (the Save button). */
  function save() {
    data.updatedAt = new Date().toISOString();
    dirty = true; if (hooks.dirty) hooks.dirty(true);
  }

  /** Write the data: to the cloud database (remote mode) or this browser (preview mode). Returns true on success. */
  async function commit() {
    if (pushing) return false;
    if (!dirty) return true;
    if (!remote) {
      try { localStorage.setItem(CFG.storageKey, JSON.stringify(data)); } catch (e) { console.warn('Could not save', e); }
      isDraft = true; dirty = false; if (hooks.dirty) hooks.dirty(false); return true;
    }
    pushing = true;
    try {
      const r = await rpc('save_league', { p_token: token, p_data: data, p_expected_rev: rev });
      rev = r.rev; dirty = false; online = true;
      if (hooks.dirty) hooks.dirty(false);
      return true;
    } catch (e) {
      if (e.code === 'conflict' || e.code === 'not_authorized') {
        if (e.code === 'not_authorized') { token = null; try { sessionStorage.removeItem(TOKEN_KEY); } catch (x) { /* ignore */ } }
        try { await loadRemote(); dirty = false; } catch (x) { /* keep local edits */ }
      } else if (e.code === 'network') online = false;
      if (hooks.dirty) hooks.dirty(dirty);
      if (hooks.fail) hooks.fail(e.code, e.message);
      return false;
    } finally { pushing = false; }
  }

  /* ---------- lookups ---------- */
  const team = (id) => data.teams.find((t) => t.id === id);
  const player = (id) => data.players.find((p) => p.id === id);
  const match = (id) => data.matches.find((m) => m.id === id);
  const sortMatches = (a, b) => (a.date === b.date ? a.round - b.round : a.date < b.date ? -1 : 1);
  const matches = (status) => data.matches.filter((m) => !status || m.status === status).sort(sortMatches);

  /* ---------- transfers & loans ----------
     A transfer moves the player to a new team for good. A loan lasts 1-3 games of the borrowing team:
     the player counts for that team until it has played those games, then returns automatically. */
  const MAX_LOAN = 3;
  const transfers = () => (data.transfers = data.transfers || []);
  const finishedOf = (tid) => matches('finished').filter((m) => m.homeId === tid || m.awayId === tid);
  const loanUsed = (l) => finishedOf(l.toTeamId).filter((m) => !(l.seen || []).includes(m.id)).length;
  const loanLeft = (l) => Math.max(0, int(l.games) - loanUsed(l));
  const activeLoan = (pid) => transfers().find((t) => t.type === 'loan' && t.playerId === pid && team(t.toTeamId) && loanLeft(t) > 0) || null;
  /** the team a player currently plays for (loan team while a loan is active) */
  const cur = (p) => { if (!p) return null; const l = activeLoan(p.id); return l ? l.toTeamId : p.teamId; };
  /** the team a player played for in a match (stored on the stat line; older data falls back to the current team) */
  const statTeam = (s) => s.teamId || cur(player(s.playerId));
  const squad = (tid) => data.players.filter((p) => cur(p) === tid);
  const backfill = (pid, tid) => data.matches.forEach((m) => (m.stats || []).forEach((s) => { if (s.playerId === pid && !s.teamId) s.teamId = tid; }));
  function cleanTransfers() {
    data.transfers = transfers().filter((t) => player(t.playerId) && team(t.toTeamId) && team(t.fromTeamId));
  }
  function undoTransfer(t) {
    if (t.type === 'transfer') { const p = player(t.playerId); if (p && p.teamId === t.toTeamId && team(t.fromTeamId)) p.teamId = t.fromTeamId; }
    data.transfers = transfers().filter((x) => x.id !== t.id);
  }
  /** add or update a transfer/loan. Returns an error message, or '' when it worked. */
  function saveTransfer(t) {
    const snap = JSON.stringify({ players: data.players, transfers: transfers(), matches: data.matches });
    const restore = () => { const o = JSON.parse(snap); data.players = o.players; data.transfers = o.transfers; data.matches = o.matches; };
    const old = t.id ? transfers().find((x) => x.id === t.id) : null;
    if (old) undoTransfer(old);
    const p = player(t.playerId), to = team(t.toTeamId), loan = t.type === 'loan';
    let err = '';
    if (!p) err = 'Choose a player.';
    else if (!to) err = 'Choose the new team.';
    else if (to.id === p.teamId) err = `${p.name} already belongs to ${to.name}.`;
    else if (activeLoan(p.id)) err = `${p.name} is on loan right now. Wait until the loan ends or delete it first.`;
    else if (loan && (int(t.games) < 1 || int(t.games) > MAX_LOAN)) err = `A loan lasts 1 to ${MAX_LOAN} games.`;
    if (err) { restore(); return err; }
    const from = team(p.teamId);
    const rec = { id: t.id || uid('x'), type: loan ? 'loan' : 'transfer', playerId: p.id, fromTeamId: p.teamId, toTeamId: to.id, date: t.date || '', note: (t.note || '').trim().slice(0, 120) };
    backfill(p.id, p.teamId);
    if (loan) { rec.games = int(t.games); rec.seen = finishedOf(to.id).map((m) => m.id); }
    else p.teamId = to.id;
    if (!from) rec.fromTeamId = p.teamId;
    transfers().push(rec); save();
    return '';
  }
  function deleteTransfer(id) { const t = transfers().find((x) => x.id === id); if (t) { undoTransfer(t); save(); } }
  const transferList = () => transfers().filter((t) => player(t.playerId) && team(t.toTeamId)).slice().sort((a, b) => (a.date === b.date ? 0 : a.date < b.date ? 1 : -1));

  function site() {
    const s = (data && data.site) || {};
    return { name: s.name || CFG.name, subtitle: s.subtitle || CFG.subtitle, tagline: s.tagline || CFG.tagline, logo: s.logo || '' };
  }

  /* ---------- CRUD ---------- */
  function saveTeam(t) { if (t.id) Object.assign(team(t.id), t); else data.teams.push({ ...t, id: uid('t') }); save(); }
  function deleteTeam(id) {
    data.players = data.players.filter((p) => p.teamId !== id);
    data.matches = data.matches.filter((m) => m.homeId !== id && m.awayId !== id);
    data.teams = data.teams.filter((t) => t.id !== id);
    cleanTransfers();
    save();
  }
  function savePlayer(p) { if (p.id) Object.assign(player(p.id), p); else data.players.push({ ...p, id: uid('p') }); save(); }
  function deletePlayer(id) {
    data.players = data.players.filter((p) => p.id !== id);
    data.matches.forEach((m) => (m.stats = m.stats.filter((s) => s.playerId !== id)));
    cleanTransfers();
    save();
  }
  function saveMatch(m) { if (m.id && match(m.id)) Object.assign(match(m.id), m); else data.matches.push({ ...m, id: uid('m') }); save(); }
  function deleteMatch(id) { data.matches = data.matches.filter((m) => m.id !== id); save(); }

  /* ---------- values, MVP, standings, leaders ---------- */
  const statValue = (s) => int(s.g) * V.goal + int(s.a) * V.assist + int(s.s) * V.save + int(s.t) * V.tackle;
  /**
   * MVP of a finished match (goal-leaning, but not only goals):
   *  1) If anyone scored CFG.mvpGoals (5) or more goals, the top scorer wins - even if somebody else has more stats overall.
   *  2) Otherwise the best all-round rating wins: goal x3, assist x2, tackle x1, save x1.
   *  Ties: more goals, then higher value.
   */
  const W = CFG.mvpWeights || { g: 3, a: 2, t: 1, s: 1 };
  const GOAL_RULE = CFG.mvpGoals || 5;
  const rating = (s) => int(s.g) * W.g + int(s.a) * W.a + int(s.t) * W.t + int(s.s) * W.s;
  function mvpOf(m) {
    if (!m || m.status !== 'finished') return null;
    const rows = (m.stats || []).filter((s) => player(s.playerId) && rating(s) > 0)
      .map((s) => ({ id: s.playerId, g: int(s.g), r: rating(s), v: statValue(s) }));
    if (!rows.length) return null;
    const scorers = rows.filter((r) => r.g >= GOAL_RULE);
    const best = (scorers.length ? scorers : rows).sort((x, y) => scorers.length
      ? y.g - x.g || y.r - x.r || y.v - x.v
      : y.r - x.r || y.g - x.g || y.v - x.v)[0];
    return best.id;
  }

  function standings() {
    const rows = {};
    data.teams.forEach((t) => (rows[t.id] = { team: t, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, form: [] }));
    matches('finished').forEach((m) => {
      const h = rows[m.homeId], a = rows[m.awayId]; if (!h || !a) return;
      const hs = int(m.homeScore), as = int(m.awayScore);
      h.p++; a.p++; h.gf += hs; h.ga += as; a.gf += as; a.ga += hs;
      if (hs > as) { h.w++; a.l++; h.pts += CFG.points.win; a.pts += CFG.points.loss; h.form.push('W'); a.form.push('L'); }
      else if (hs < as) { a.w++; h.l++; a.pts += CFG.points.win; h.pts += CFG.points.loss; a.form.push('W'); h.form.push('L'); }
      else { h.d++; a.d++; h.pts += CFG.points.draw; a.pts += CFG.points.draw; h.form.push('D'); a.form.push('D'); }
    });
    return Object.values(rows).map((r) => ({ ...r, gd: r.gf - r.ga }))
      .sort((x, y) => y.pts - x.pts || y.gd - x.gd || y.gf - x.gf || x.team.name.localeCompare(y.team.name));
  }

  function totals() {
    const tot = {};
    data.players.forEach((p) => (tot[p.id] = { g: 0, a: 0, t: 0, s: 0, apps: 0, mvps: 0, value: 0 }));
    matches('finished').forEach((m) => {
      const mvp = mvpOf(m);
      m.stats.forEach((st) => {
        const r = tot[st.playerId]; if (!r) return;
        r.apps++; STATS.forEach((k) => (r[k] += int(st[k]))); r.value += statValue(st);
      });
      if (mvp && tot[mvp]) { tot[mvp].mvps++; tot[mvp].value += V.mvp; }
    });
    return tot;
  }

  /** stat: g | a | t | s | value | mvps */
  function leaders(stat, n) {
    const tot = totals();
    return data.players.map((p) => ({ player: p, value: tot[p.id][stat], apps: tot[p.id].apps }))
      .filter((r) => r.value > 0)
      .sort((x, y) => y.value - x.value || x.apps - y.apps || x.player.name.localeCompare(y.player.name))
      .slice(0, n || 10);
  }

  /* ---------- auth ---------- */
  function adminCreds() {
    try { const o = JSON.parse(localStorage.getItem(ADMIN_KEY)); if (o && o.username && o.hash && o.salt) return o; } catch (e) { /* ignore */ }
    return { username: CFG.admin.username, salt: CFG.admin.salt, hash: CFG.admin.passwordHash };
  }
  async function login(u, p) {
    if (remote) {
      try {
        token = await rpc('admin_login', { p_username: u.trim(), p_password: p });
        try { sessionStorage.setItem(TOKEN_KEY, token); } catch (e) { /* memory only */ }
        return true;
      } catch (e) { if (e.code === 'bad_credentials') return false; throw e; }
    }
    const c = adminCreds();
    if (u.trim() === c.username && hashPw(c.salt, p) === c.hash) { memSession = true; try { sessionStorage.setItem(SESSION_KEY, '1'); } catch (e) { /* memory only */ } return true; }
    return false;
  }
  function logout() {
    if (remote) { if (token) rpc('admin_logout', { p_token: token }).catch(() => {}); token = null; try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* ignore */ } return; }
    memSession = false; try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* ignore */ }
  }
  function isAdmin() {
    if (remote) return !!token;
    if (memSession) return true;
    try { return sessionStorage.getItem(SESSION_KEY) === '1'; } catch (e) { return false; }
  }
  // remote admin management
  const listAdmins = () => rpc('list_admins', { p_token: token });
  const addAdmin = (u, p) => rpc('add_admin', { p_token: token, p_username: u.trim(), p_password: p });
  const removeAdmin = (u) => rpc('remove_admin', { p_token: token, p_username: u });
  function clearAll() { const s = data.site; data = emptyData(); data.site = s || {}; save(); }

  window.Store = {
    init, get: () => data, remote, isDraft: () => isDraft, online: () => online, lastError: () => lastError, hooks, sha256, hashPw,
    team, player, match, matches, site, cur, squad, statTeam, activeLoan, loanLeft, loanUsed, transferList, saveTransfer, deleteTransfer, MAX_LOAN,
    saveTeam, deleteTeam, savePlayer, deletePlayer, saveMatch, deleteMatch,
    standings, totals, leaders, mvpOf, statValue, STATS, VALUES: V,
    login, logout, isAdmin, listAdmins, addAdmin, removeAdmin,
    commit, dirty: () => dirty, clearAll
  };
})();

/**
 * App – hash-router, public pages and the admin panel.
 */
(function () {
  'use strict';
  const CFG = window.LEAGUE_CONFIG, S = window.Store, V = CFG.values;
  const rootEl = document.getElementById('root');
  if (rootEl && window.__SHELL) rootEl.innerHTML = window.__SHELL;
  const DEFAULT_LOGO = window.__LOGO || 'assets/logo.png';
  const app = document.getElementById('app');
  const POS = { GK: 'Goalkeeper', DEF: 'Defender', MID: 'Midfielder', FWD: 'Forward' };
  const POS_ORDER = ['GK', 'DEF', 'MID', 'FWD'];
  const STAT_NAME = { g: 'Goals', a: 'Assists', t: 'Tackles', s: 'Saves', value: 'Market value', mvps: 'MVP awards' };

  /* ---------- helpers ---------- */
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (v) => { const n = parseInt(v, 10); return Number.isFinite(n) && n > 0 ? n : 0; };
  const fmtDate = (d) => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
  const safeColor = (c) => (/^#[0-9a-f]{3,8}$/i.test(c) ? c : '#1d6fe0');
  const safeUrl = (u) => (/^(https:\/\/|assets\/|data:image\/(png|jpe?g|webp|gif);base64,)/i.test(u || '') ? u : '');
  const trim = (x) => String(parseFloat(x.toFixed(2)));
  const money = (n) => (n >= 1e6 ? '$' + trim(n / 1e6) + 'M' : n >= 1e3 ? '$' + trim(n / 1e3) + 'K' : '$' + n);
  const fmtStat = (k, v) => (k === 'value' ? money(v) : v);
  const siteLogo = () => safeUrl(S.site().logo) || DEFAULT_LOGO;
  const toast = (msg) => { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800); };
  const byPos = (x, y) => POS_ORDER.indexOf(x.pos) - POS_ORDER.indexOf(y.pos) || x.name.localeCompare(y.name);

  function badge(t, size) {
    if (!t) return '<span class="badge">?</span>';
    const logo = safeUrl(t.logo);
    const st = `--c:${safeColor(t.color)}` + (size ? `;--s:${size}px` : '');
    return logo ? `<span class="badge img" style="${st}"><img src="${esc(logo)}" alt=""></span>` : `<span class="badge" style="${st}">${esc((t.short || t.name || '?').slice(0, 3).toUpperCase())}</span>`;
  }
  const teamLink = (t) => t ? `<a class="tlink" href="#team-${t.id}">${badge(t, 24)}<span>${esc(t.name)}</span></a>` : '—';
  const playerLink = (p) => p ? `<a href="#player-${p.id}">${esc(p.name)}</a>` : '—';
  const empty = (msg) => `<div class="empty">${msg}</div>`;

  /** Resize an uploaded image to a small data URI so it can live in the database.
      Works with photos from a phone gallery or Files app (also when the file type is not reported). */
  function fileToDataUrl(file, max) {
    const draw = (img) => {
      const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if (!w || !h) throw new Error('empty');
      const r = Math.min(1, max / Math.max(w, h));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * r)); c.height = Math.max(1, Math.round(h * r));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let out = c.toDataURL('image/webp', 0.9);
      if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/png');
      return out;
    };
    const load = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('load')); i.src = src; });
    return (async () => {
      if (!file) throw new Error('No file chosen.');
      if (/^(video|audio)\//.test(file.type) || file.type === 'application/pdf') throw new Error('Please choose a photo or image file.');
      try {
        const url = URL.createObjectURL(file);
        try { return draw(await load(url)); } finally { URL.revokeObjectURL(url); }
      } catch (e1) {
        try {
          const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('read')); r.readAsDataURL(file); });
          return draw(await load(dataUrl));
        } catch (e2) { throw new Error('Could not read that image. Try a JPG or PNG.'); }
      }
    })();
  }

  function matchCard(m) {
    const h = S.team(m.homeId), a = S.team(m.awayId); if (!h || !a) return '';
    const fin = m.status === 'finished', mvp = S.player(S.mvpOf(m));
    return `<a class="match-card" href="#match-${m.id}">
      <div class="mc-meta"><span>Round ${esc(m.round)}</span><span>${fmtDate(m.date)}</span></div>
      <div class="mc-row">

        <span class="mc-score ${fin ? '' : 'upcoming'}">${fin ? `${m.homeScore}<i>–</i>${m.awayScore}` : 'vs'}</span>

  /* Forms: sandboxed preview panes block native form submission (no submit event at all),
     so submit buttons call the form's handler directly. Works the same in normal browsers. */
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn || btn.disabled) return;
    const form = btn.form;
    if (!form || typeof form.onsubmit !== 'function') return;
    if (btn.type !== 'submit') return;
    e.preventDefault();
    if (typeof form.reportValidity === 'function' && !form.reportValidity()) return;
    form.onsubmit.call(form, { preventDefault() {}, target: form });
  });

  /* in-page confirmation (native confirm() is unavailable in some hosts) */
  function ask(msg, okLabel) {
    return new Promise((res) => {
      const el = document.createElement('div');
      el.className = 'modal-back'; el.style.zIndex = 150;
      el.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true"><div class="modal-body"><p class="ask-msg">${esc(msg)}</p><div class="form-actions"><button type="button" class="btn" data-n>Cancel</button><button type="button" class="btn danger" data-y>${esc(okLabel || 'Confirm')}</button></div></div></div>`;
      const done = (v) => { el.remove(); res(v); };
      el.querySelector('[data-n]').onclick = () => done(false);
      el.querySelector('[data-y]').onclick = () => done(true);
      el.addEventListener('mousedown', (e) => { if (e.target === el) done(false); });
      document.body.appendChild(el); el.querySelector('[data-n]').focus();
    });
  }

  /* ---------- modal ---------- */
  function openModal(title, body, wide) {
    closeModal();
    const el = document.createElement('div');
    el.className = 'modal-back'; el.id = 'modal';
    el.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Close">✕</button></div><div class="modal-body">${body}</div></div>`;
    el.addEventListener('mousedown', (e) => { if (e.target === el) closeModal(); });
    el.querySelector('[data-close]').onclick = closeModal;
    document.body.appendChild(el); document.body.classList.add('no-scroll');
    const f = el.querySelector('input,select'); if (f) f.focus();
    return el;
  }
  function closeModal() { const m = document.getElementById('modal'); if (m) m.remove(); document.body.classList.remove('no-scroll'); }

    }).join('')}</div>

  }

  /* ---------- transfers ---------- */
  function transferRow(t, admin) {
    const p = S.player(t.playerId), from = S.team(t.fromTeamId), to = S.team(t.toTeamId), loan = t.type === 'loan', left = loan ? S.loanLeft(t) : 0;
    const kind = !loan ? '<span class="pill ok">Transfer</span>'
      : left > 0 ? `<span class="pill live">Loan · ${left} of ${t.games} game${t.games === 1 ? '' : 's'} left</span>`
        : `<span class="pill">Loan ended (${t.games} game${t.games === 1 ? '' : 's'})</span>`;
    return `<div class="tr-item"><div class="tr-top"><span class="tr-who">${playerLink(p)}</span>${kind}</div>
      <div class="tr-move">${teamLink(from)} <span class="arrow">➜</span> ${teamLink(to)}</div>
      <div class="tr-foot"><small class="muted">${[fmtDate(t.date), t.note ? esc(t.note) : ''].filter(Boolean).join(' · ') || '&nbsp;'}</small>

  function transferTable(admin) {

      <label>New team *<select name="toTeamId" required><option value="">Choose…</option>${d.teams.map((x) => `<option value="${x.id}" ${x.id === t.toTeamId ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>
      <label data-loan>Games on loan<select name="games">${[1, 2, 3].map((n) => `<option value="${n}" ${n === num(t.games) ? 'selected' : ''}>${n} game${n === 1 ? '' : 's'}</option>`).join('')}</select></label>
      <label>Date<input name="date" type="date" value="${esc(t.date)}"></label>

  let loginFails = 0, lockUntil = 0;
  function viewLogin() {
    return `<div class="login-card card"><img src="${esc(siteLogo())}" alt="" width="72" height="72"><h1>Admin login</h1>
      <p class="muted">Sign in to manage the whole site: teams, players, matches, stats and settings.</p>
      <form id="loginForm" autocomplete="on"><label>Username<input name="u" autocomplete="username" required></label>
      <label>Password<input name="p" type="password" autocomplete="current-password" required></label>
      <div class="err" id="loginErr" role="alert"></div><button class="btn primary block" type="submit">Sign in</button></form></div>`;
  }
  function bindLogin() {
    $('#loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const err = $('#loginErr'), now = Date.now(), f = e.target;
      if (now < lockUntil) { err.textContent = `Too many attempts. Wait ${Math.ceil((lockUntil - now) / 1000)}s.`; return; }
      const btn = f.querySelector('button'); btn.disabled = true; err.textContent = '';
      try {
        if (await S.login(f.u.value, f.p.value)) { loginFails = 0; toast('Welcome back, admin'); go('#admin-teams'); return; }
        loginFails++; if (loginFails >= 3) { lockUntil = Date.now() + 10000; loginFails = 0; }
        err.textContent = 'Wrong username or password.'; f.p.value = '';
      } catch (ex) { err.textContent = ex.code === 'network' ? 'Cannot reach the database. Check your connection and the Supabase settings.' : 'Sign-in failed: ' + (ex.message || 'unknown error'); }
      btn.disabled = false;
    };
  }

  /** image-upload widget used by the team form */
  function imageField(el, current, onChange, renderPreview) {
    let value = current || '';
    const prev = el.querySelector('[data-prev]'), file = el.querySelector('[data-file]');
    const paint = () => { prev.innerHTML = renderPreview(value); el.querySelector('[data-rm]').hidden = !value; };
    el.querySelector('[data-rm]').onclick = () => { value = ''; file.value = ''; onChange(value); paint(); };
    file.onchange = async () => {
      const f = file.files[0]; if (!f) return;
      try { value = await fileToDataUrl(f, 192); onChange(value); paint(); }
      catch (err) { toast(err.message); }
    };
    paint();
    return { get: () => value, repaint: paint };
  }
  const imageFieldHTML = (title, hint) => `<div class="img-field full"><span class="lbl">${title}</span><div class="img-row"><div data-prev class="img-prev"></div><div class="img-actions"><label class="btn small upload-btn">⬆ Upload image<input type="file" data-file accept="image/*"></label><button type="button" class="btn small danger" data-rm>Remove</button><small class="muted">${hint}</small></div></div></div>`;

      ${list.map((p) => `<tr><td class="left">${playerLink(p)}</td><td class="left">${esc((S.team(S.cur(p)) || {}).name)}${loanTag(p)}</td><td>${p.pos}</td><td class="val">${money(tot[p.id].value)}</td>

      ${list.map((m) => { const h = S.team(m.homeId), a = S.team(m.awayId); return `<tr><td>${esc(m.round)}</td><td>${fmtDate(m.date)}</td><td class="left">${esc(h && h.name)}</td><td><b>${m.status === 'finished' ? `${m.homeScore} – ${m.awayScore}` : 'vs'}</b></td><td class="left">${esc(a && a.name)}</td><td><span class="pill ${m.status === 'finished' ? 'ok' : ''}">${m.status === 'finished' ? 'Played' : 'Scheduled'}</span></td>
      <td class="actions"><button class="btn small" data-edit-match="${m.id}">Edit / Stats</button><button class="btn small danger" data-del-match="${m.id}">Delete</button></td></tr>`; }).join('')}</tbody></table></div>` : empty('No matches yet.')}</section>`;
  }

  function matchForm(m) {
    const d = S.get(), isNew = !m;
    const maxRound = d.matches.reduce((x, y) => Math.max(x, num(y.round)), 0);
    m = m || { round: maxRound || 1, date: new Date().toISOString().slice(0, 10), homeId: (d.teams[0] || {}).id, awayId: (d.teams[1] || {}).id, status: 'scheduled', halves: [], stats: [] };
    const hasHalves = Array.isArray(m.halves) && m.halves.length > 0;
    let nh = hasHalves ? Math.min(4, m.halves.length) : 2;
    const halves = [0, 1, 2, 3].map((i) => (hasHalves && m.halves[i] ? { h: num(m.halves[i].h), a: num(m.halves[i].a) } : { h: 0, a: 0 }));
    if (!hasHalves && m.status === 'finished') halves[0] = { h: num(m.homeScore), a: num(m.awayScore) };
    const stats = {};
    const locked = {};   // players whose team in this match is already recorded
    (m.stats || []).forEach((s) => { stats[s.playerId] = { p: true, g: num(s.g), a: num(s.a), t: num(s.t), s: num(s.s) }; if (s.teamId) locked[s.playerId] = s.teamId; });
    const rosterOf = (tid) => d.players.filter((p) => (locked[p.id] ? locked[p.id] === tid : S.cur(p) === tid));
    const opt = (sel) => d.teams.map((t) => `<option value="${t.id}" ${t.id === sel ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
    const el = openModal(isNew ? 'Add match' : 'Edit match & player stats', `<form id="mf">
      <div class="form-grid">
        <label>Round<input name="round" type="number" min="1" value="${esc(m.round)}" required></label>
        <label>Date<input name="date" type="date" value="${esc(m.date)}" required></label>
        <label>Home team<select name="homeId">${opt(m.homeId)}</select></label>
        <label>Away team<select name="awayId">${opt(m.awayId)}</select></label>
        <label>Number of legs<select name="nh">${[2, 3, 4].map((n) => `<option value="${n}" ${n === nh ? 'selected' : ''}>${n} legs</option>`).join('')}</select></label>
        <label>Status<select name="status"><option value="scheduled" ${m.status === 'scheduled' ? 'selected' : ''}>Scheduled</option><option value="finished" ${m.status === 'finished' ? 'selected' : ''}>Finished (played)</option></select></label>
      </div>
      <div id="scoreBox"></div>
      <div id="statsBox"></div>
      <div class="form-actions"><button type="button" class="btn" data-close2>Cancel</button><button class="btn primary">Save match</button></div></form>`, true);
    const f = el.querySelector('#mf');
    el.querySelector('[data-close2]').onclick = closeModal;

    const sumHalves = (k) => halves.slice(0, nh).reduce((x, y) => x + y[k], 0);
    const teamGoals = (tid) => rosterOf(tid).reduce((x, p) => x + (stats[p.id] ? num(stats[p.id].g) : 0), 0);
    const updateTotals = () => {
      const th = el.querySelector('#totH'), ta = el.querySelector('#totA'); if (th) { th.textContent = sumHalves('h'); ta.textContent = sumHalves('a'); }
      el.querySelectorAll('[data-total]').forEach((s) => { const g = teamGoals(s.dataset.total); s.textContent = `${g} goal${g === 1 ? '' : 's'}`; });
      const note = el.querySelector('#goalNote');
      if (note) { const pg = [teamGoals(f.homeId.value), teamGoals(f.awayId.value)], ok = pg[0] === sumHalves('h') && pg[1] === sumHalves('a'); note.textContent = ok ? '' : `Players' goals add up to ${pg[0]}–${pg[1]}, the leg scores to ${sumHalves('h')}–${sumHalves('a')}.`; }
    };
    const drawScore = () => {
      const box = el.querySelector('#scoreBox');
      if (f.status.value !== 'finished') { box.innerHTML = ''; return; }
      const hT = S.team(f.homeId.value), aT = S.team(f.awayId.value);
      box.innerHTML = `<div class="halves-grid"><span></span><b>${esc(hT ? hT.name : 'Home')}</b><b>${esc(aT ? aT.name : 'Away')}</b>
        ${halves.slice(0, nh).map((x, i) => `<span class="hl-name">Leg ${i + 1}</span><input type="number" min="0" max="99" inputmode="numeric" data-half="${i}" data-side="h" value="${x.h}" aria-label="Leg ${i + 1} home goals"><input type="number" min="0" max="99" inputmode="numeric" data-half="${i}" data-side="a" value="${x.a}" aria-label="Leg ${i + 1} away goals">`).join('')}
        <span class="hl-name tot">Total</span><b class="tot" id="totH"></b><b class="tot" id="totA"></b></div><p class="err" id="goalNote"></p>`;
      updateTotals();
    };
    el.querySelector('#scoreBox').addEventListener('input', (e) => {
      const i = e.target.dataset.half; if (i === undefined) return;
      halves[+i][e.target.dataset.side] = num(e.target.value); updateTotals();
    });

    const teamGrid = (tid) => {
      const t = S.team(tid), squad = rosterOf(tid).sort(byPos);
      if (!squad.length) return `<div class="sg-team"><h4>${esc(t.name)}</h4>${empty('This team has no players yet.')}</div>`;
      return `<div class="sg-team" data-team="${tid}"><h4>${badge(t, 22)} ${esc(t.name)} <span class="sg-total" data-total="${tid}"></span></h4>
        <div class="sg-row sg-headrow"><span title="Played">✓</span><span>Player</span><span title="Goals">G</span><span title="Assists">A</span><span title="Tackles">T</span><span title="Saves">S</span></div>
        ${squad.map((p) => { const s = stats[p.id] || { p: false, g: 0, a: 0, t: 0, s: 0 }; return `<div class="sg-row" data-pid="${p.id}">
          <input type="checkbox" data-k="p" ${s.p ? 'checked' : ''} aria-label="Played">
          <span class="sg-name">${esc(p.name)} <small>${p.pos}</small></span>
          ${['g', 'a', 't', 's'].map((k) => `<input type="number" min="0" max="99" inputmode="numeric" data-k="${k}" value="${s[k]}" aria-label="${STAT_NAME[k]}">`).join('')}</div>`; }).join('')}</div>`;
    };
    const drawStats = () => {
      const box = el.querySelector('#statsBox'), fin = f.status.value === 'finished';
      drawScore();
      if (!fin) { box.innerHTML = '<p class="muted">Set the status to <b>Finished</b> to enter the leg scores and player stats (G · A · T · S).</p>'; return; }
      if (f.homeId.value === f.awayId.value) { box.innerHTML = '<p class="err">Home and away team must be different.</p>'; return; }
      box.innerHTML = `<div class="sg-head"><h3>Player stats (whole match)</h3></div><p class="muted small">MVP bonus +${money(V.mvp)}. ${mvpRule()}</p><div class="sg-cols">${teamGrid(f.homeId.value)}${teamGrid(f.awayId.value)}</div>`;
      updateTotals();
    };
    el.querySelector('#statsBox').addEventListener('input', (e) => {
      const row = e.target.closest('[data-pid]'); if (!row) return;
      const k = e.target.dataset.k, st = (stats[row.dataset.pid] = stats[row.dataset.pid] || { p: false, g: 0, a: 0, t: 0, s: 0 });
      if (k === 'p') st.p = e.target.checked;
      else { st[k] = num(e.target.value); if (st[k] > 0 && !st.p) { st.p = true; row.querySelector('[data-k=p]').checked = true; } }
      updateTotals();
    });
    ['status', 'homeId', 'awayId'].forEach((n) => (f[n].onchange = drawStats));
    f.nh.onchange = () => { nh = parseInt(f.nh.value, 10); drawScore(); };
    drawStats();

    f.onsubmit = async (e) => {
      e.preventDefault();
      if (f.homeId.value === f.awayId.value) { toast('Home and away team must be different'); return; }
      const fin = f.status.value === 'finished';
      const homeIds = new Set(rosterOf(f.homeId.value).map((p) => p.id)), awayIds = new Set(rosterOf(f.awayId.value).map((p) => p.id));
      const list = fin ? Object.entries(stats).filter(([id, s]) => (homeIds.has(id) || awayIds.has(id)) && (s.p || s.g || s.a || s.t || s.s)).map(([playerId, s]) => ({ playerId, teamId: homeIds.has(playerId) ? f.homeId.value : f.awayId.value, g: s.g, a: s.a, t: s.t, s: s.s })) : [];
      const hs = sumHalves('h'), as = sumHalves('a');
      if (fin && list.length && (teamGoals(f.homeId.value) !== hs || teamGoals(f.awayId.value) !== as) && !(await ask(`The leg scores add up to ${hs}–${as}, but the players' goals add up to ${teamGoals(f.homeId.value)}–${teamGoals(f.awayId.value)}. Save anyway?`, 'Save anyway'))) return;
      S.saveMatch({ id: m.id, round: num(f.round.value) || 1, date: f.date.value, homeId: f.homeId.value, awayId: f.awayId.value, status: f.status.value, halves: fin ? halves.slice(0, nh).map((x) => ({ h: x.h, a: x.a })) : [], homeScore: fin ? hs : null, awayScore: fin ? as : null, stats: list });
      closeModal(); toast('Match updated. Press Save to publish.'); render();
    };
  }

  async function adminAdmins() {
    const box = $('#adminList'); if (!box) return;
    try {
      const list = await S.listAdmins();
      box.innerHTML = (list || []).map((u) => `<li><span>${esc(u)}</span><button class="btn small danger" data-rm-admin="${esc(u)}">Remove</button></li>`).join('') || '<li class="muted">No admins</li>';
    } catch (e) { box.innerHTML = `<li class="err">Could not load admins (${esc(e.message || e.code)}).</li>`; }
  }

  function adminSettings() {
    const remote = S.remote;
    return `<div class="grid-2">
      ${remote ? `<section class="card"><div class="card-head"><h2>Admin accounts</h2></div>
        <p class="muted small">Every admin can edit the whole site and add or remove other admins.</p>
        <ul class="admin-list" id="adminList"><li class="muted">Loading…</li></ul>
        <form id="addAdminForm" class="form-grid one"><label>New admin username<input name="u" required maxlength="60" autocomplete="off"></label>
        <label>Password (min. 8 characters)<input name="p" type="password" required minlength="8" autocomplete="new-password"></label><button class="btn primary">Add admin</button></form></section>` : ''}
      <section class="card"><div class="card-head"><h2>Start over</h2></div>
        <p class="muted small">Removes every team, player and match. Press <b>Save</b> afterwards to make it permanent.</p>
        <button class="btn danger" id="clearBtn">🗑 Delete all teams, players and matches</button></section>
    </div>`;
  }

  function bindAdmin(tab) {
    $('#logoutBtn').onclick = () => { S.logout(); toast('Logged out'); go('#home'); };
    if (tab === 'teams') {
      $('#addTeam').onclick = () => teamForm();
    } else if (tab === 'players') {
      const a = $('#addPlayer'); if (a) a.onclick = () => playerForm();
      $('#apQ').oninput = (e) => { pFilter.q = e.target.value; const pos = e.target.selectionStart; render(); const n = $('#apQ'); n.focus(); n.setSelectionRange(pos, pos); };
      $('#apTeam').onchange = (e) => { pFilter.team = e.target.value; render(); };
    } else if (tab === 'matches') {
      const a = $('#addMatch'); if (a) a.onclick = () => matchForm();
    } else if (tab === 'settings') {
      if (S.remote) {
        adminAdmins();
        $('#addAdminForm').onsubmit = async (e) => {
          e.preventDefault(); const f = e.target;
          try { await S.addAdmin(f.u.value, f.p.value); toast('Admin saved'); f.reset(); adminAdmins(); } catch (err) { toast('Could not add admin: ' + (err.message || err.code)); }
        };
      }
      $('#clearBtn').onclick = async () => { if (await ask('Delete ALL teams, players and matches? This cannot be undone.', 'Delete everything')) { S.clearAll(); toast('League cleared. Press Save to keep this.'); render(); } };
    }
  }

  /* delegated clicks for edit/delete buttons (admin pages + public pages when logged in) */
  document.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b || !S.isAdmin()) return;
    const ds = b.dataset;
    const after = (msg) => { toast(msg); if (/^(match|team|player)-/.test(route)) go(/^match/.test(route) ? '#matches' : /^team/.test(route) ? '#teams' : '#players'); else render(); };
    if (ds.editTeam) teamForm(S.team(ds.editTeam));
    else if (ds.delTeam) { const t = S.team(ds.delTeam); if (await ask(`Delete ${t.name}? Its players and matches will be deleted too.`, 'Delete team')) { S.deleteTeam(t.id); after('Team deleted'); } }
    else if (ds.editPlayer) playerForm(S.player(ds.editPlayer));
    else if (ds.delPlayer) { const p = S.player(ds.delPlayer); if (await ask(`Delete ${p.name}?`, 'Delete player')) { S.deletePlayer(p.id); after('Player deleted'); } }
    else if (ds.addTransfer) transferForm()
    else if (ds.editTransfer) transferForm(S.transferList().find((z) => z.id === ds.editTransfer))
    else if (ds.delTransfer) { if (await ask('Delete this transfer? The player goes back to his old team.', 'Delete transfer')) { S.deleteTransfer(ds.delTransfer); toast('Transfer deleted. Press Save to publish.'); render(); } }
    else if (ds.editMatch) matchForm(S.match(ds.editMatch));
    else if (ds.delMatch) { if (await ask('Delete this match and its result?', 'Delete match')) { S.deleteMatch(ds.delMatch); after('Match deleted'); } }
    else if (ds.rmAdmin) { if (await ask(`Remove admin “${ds.rmAdmin}”?`, 'Remove')) { try { await S.removeAdmin(ds.rmAdmin); toast('Admin removed'); adminAdmins(); } catch (err) { toast(err.message || 'Could not remove admin'); } } }
  });

  /* ---------- save bar (changes are kept until the admin presses Save) ---------- */
  let saving = false;
  function refreshSaveBar() {
    let bar = document.getElementById('savebar');
    const show = S.isAdmin() && (S.dirty() || saving);
    if (!show) { if (bar) bar.remove(); return; }
    if (!bar) {
      bar = document.createElement('div'); bar.id = 'savebar'; bar.className = 'savebar';
      bar.innerHTML = '<span id="saveMsg"></span><button class="btn primary" id="saveBtn">Save</button>';
      document.body.appendChild(bar);
      bar.querySelector('#saveBtn').onclick = doSave;
    }
    bar.querySelector('#saveMsg').textContent = saving ? 'Saving…' : 'You have unsaved changes';
    bar.querySelector('#saveBtn').disabled = saving;
  }
  async function doSave() {
    if (saving) return;
    saving = true; refreshSaveBar();
    const ok = await S.commit();
    saving = false; refreshSaveBar();
    if (ok) toast('Saved ✓');
  }
  window.addEventListener('beforeunload', (e) => { if (S.isAdmin() && S.dirty()) { e.preventDefault(); e.returnValue = ''; } });

  /* =====================================================
     ROUTER
     The current page is kept in a variable, so navigation also works where the browser blocks
     hash changes (some preview panes and sandboxed frames).
     ===================================================== */
  let route = (() => { try { return location.hash.replace(/^#/, ''); } catch (e) { return ''; } })();
  function go(h) {
    const r = String(h).replace(/^#/, '');
    if (r === route && document.getElementById('app').children.length) { render(); return; }
    route = r;
    try { if (location.hash.replace(/^#/, '') !== r) history.pushState(null, '', '#' + r); } catch (e) { /* hash not writable here */ }
    render(); window.scrollTo(0, 0);
  }
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault(); go(a.getAttribute('href'));
  });
  window.addEventListener('popstate', () => { route = location.hash.replace(/^#/, ''); render(); });
  window.addEventListener('hashchange', () => { const r = location.hash.replace(/^#/, ''); if (r !== route) { route = r; render(); window.scrollTo(0, 0); } });

  /* ROUTER (rendering)
     ===================================================== */
  function applySite() {
    const s = S.site();
    document.title = `${s.name} ${s.subtitle}`.trim();
    const set = (id, t) => { const n = document.getElementById(id); if (n) n.textContent = t; };
    set('leagueName', s.name); set('leagueSeason', s.subtitle); set('footName', s.name); set('year', new Date().getFullYear());
    const bl = document.querySelector('.brand-logo'); if (bl) bl.src = siteLogo();
  }

  function updateNav() {
    const cur = route.split('-')[0] || 'home';
    document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('active', a.dataset.route === (cur === 'team' ? 'teams' : cur === 'player' ? 'players' : cur === 'match' ? 'matches' : cur)));
    $('#navAdmin').textContent = S.isAdmin() ? 'Admin ●' : 'Admin';
  }

  function render() {
    closeModal();
    const hs = route, cut = hs.indexOf('-');
    const [r, arg] = [(cut < 0 ? hs : hs.slice(0, cut)) || 'home', cut < 0 ? undefined : hs.slice(cut + 1)];
    let html = null;
    switch (r) {
      case 'home': html = viewHome(); break;
      case 'standings': html = viewStandings(); break;
      case 'matches': viewMatches(); break;
      case 'match': html = viewMatch(arg); break;
      case 'teams': html = viewTeams(); break;
      case 'team': html = viewTeam(arg); break;
      case 'players': viewPlayers(); break;
      case 'player': html = viewPlayer(arg); break;
      case 'leaders': html = viewLeaders(); break;
      case 'transfers': html = viewTransfers(); break;
      case 'admin': {
        if (!S.isAdmin()) { app.innerHTML = viewLogin(); bindLogin(); break; }
        const tab = ['teams', 'players', 'matches', 'transfers', 'settings'].includes(arg) ? arg : 'teams';
        const inner = { teams: adminTeams, players: adminPlayers, matches: adminMatches, transfers: adminTransfers, settings: adminSettings }[tab]();
        app.innerHTML = adminShell(tab, inner); bindAdmin(tab); break;
      }
      default: html = notFound();
    }
    if (html !== null) app.innerHTML = html;
    applySite(); updateNav(); refreshSaveBar();
    $('#nav').classList.remove('open');
  }

  async function start() {
    document.getElementById('menuToggle').onclick = () => $('#nav').classList.toggle('open');
    app.innerHTML = '<div class="empty">Loading…</div>';
    S.hooks.dirty = refreshSaveBar;
    S.hooks.fail = (code, msg) => {
      toast(code === 'conflict' ? 'Another admin saved first, so your changes were not applied. The latest data is loaded; please redo your change and press Save.'
        : code === 'not_authorized' ? 'Your admin session expired. Please sign in again.'
          : code === 'network' ? 'Cannot reach the database. Your changes are not saved yet. Try Save again.' : 'Could not save: ' + (msg || code));
      render();
    };
    S.hooks.changed = () => { const ae = document.activeElement; if (document.getElementById('modal') || (ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))) return; render(); };
    await S.init();
    render();
  }
  start();
})();

</script>
</body>
</html>
